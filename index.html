<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FutBet Pro - Oficial</title>
    <style>
        :root { --bg: #0d1117; --card: #161b22; --border: #30363d; --accent: #238636; --text: #f0f6fc; --gold: #d29922; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; justify-content: center; }
        #app { width: 100%; max-width: 480px; padding: 15px; box-sizing: border-box; min-height: 100vh; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 15px; margin-bottom: 15px; }
        .hidden { display: none !important; }
        input, select, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid var(--border); background: #0d1117; color: white; box-sizing: border-box; }
        button { background: var(--accent); border: none; font-weight: bold; cursor: pointer; }
        .tab-nav { display: flex; gap: 5px; margin-bottom: 15px; }
        .tab-nav button { background: var(--card); font-size: 0.8rem; flex: 1; }
        .tab-nav button.active { background: var(--accent); border: 1px solid #fff; }
        .user-item { border-bottom: 1px solid #333; padding: 10px 0; display: flex; flex-direction: column; gap: 5px; }
        .u-btns { display: flex; gap: 5px; }
        .btn-mini { padding: 5px; font-size: 0.65rem; width: auto; flex: 1; background: #30363d; }
        .history-item { font-size: 0.75rem; border-left: 3px solid var(--gold); padding-left: 10px; margin-bottom: 12px; position: relative; }
        .h-btns { display: flex; gap: 5px; margin-top: 5px; }
    </style>
</head>
<body>

<div id="app">
    <div id="view-login" onkeydown="if(event.keyCode==13) login()">
        <div class="card" style="text-align: center; margin-top: 30px;">
            <h1 style="color: var(--accent);">🏟️ FutBet</h1>
            <input type="file" id="import-master" accept=".json">
            <button onclick="manualLoadMaster()" style="background: var(--gold); color: #000;">ATIVAR DATA.JSON</button>
            <hr style="border:0.5px solid var(--border); margin:20px 0;">
            <input type="text" id="user-login" placeholder="Usuário">
            <input type="password" id="pass-login" placeholder="Senha">
            <button onclick="login()">ENTRAR</button>
        </div>
    </div>

    <div id="view-main" class="hidden">
        <div class="tab-nav" id="nav-bar"></div>

        <div id="tab-palpites" class="hidden">
            <div class="card">
                <h3 id="m-title" style="text-align:center;">Sem Jogo</h3>
                <p id="m-time" style="text-align:center; font-size:0.8rem; color:var(--gold);"></p>
                <button onclick="exportPalpite()">GERAR MEU PALPITE (JSON)</button>
            </div>
        </div>

        <div id="tab-ranking" class="hidden">
            <div class="card" id="list-ranking"></div>
        </div>

        <div id="tab-admin" class="hidden">
            <div class="card" style="border: 1px solid var(--gold);">
                <button onclick="exportMasterFile()" style="background: var(--gold); color: #000;">💾 BAIXAR DATA.JSON ATUALIZADO</button>
            </div>

            <div class="card">
                <h3>Gerenciar Jogadores</h3>
                <input type="hidden" id="edit-player-idx" value="-1">
                <input type="text" id="n-u" placeholder="Nome de Jogador">
                <input type="text" id="n-p" placeholder="Senha">
                <input type="text" id="n-i" placeholder="URL da Foto">
                <button onclick="savePlayer()">SALVAR JOGADOR</button>
                <div id="user-manage-list" style="margin-top:10px;"></div>
            </div>

            <div class="card">
                <h3>Configurar Rodada</h3>
                <input type="text" id="adm-a" placeholder="Time A">
                <input type="text" id="adm-b" placeholder="Time B">
                <input type="datetime-local" id="adm-date">
                <button onclick="updateMatchLocal()">PUBLICAR JOGO</button>
                
                <h4 style="margin-top:15px; font-size:0.8rem; color:var(--gold);">Registro de Jogos:</h4>
                <div id="history-list"></div>
            </div>

            <button onclick="resetSystem()" style="background:#511; font-size:0.7rem; width:100%;">RESETAR TODO O SISTEMA</button>
        </div>
    </div>
</div>

<script>
    let masterData = { users: [], match: { a: "", b: "", date: "" }, ranking: [], history: [] };
    let currentUser = null;

    // Carrega do armazenamento local ao iniciar
    const saved = localStorage.getItem('futbet_master');
    if(saved) masterData = JSON.parse(saved);

    function manualLoadMaster() {
        const file = document.getElementById('import-master').files[0];
        if (!file) return alert("Selecione o arquivo primeiro!");
        const reader = new FileReader();
        reader.onload = (e) => {
            masterData = JSON.parse(e.target.result);
            if(!masterData.history) masterData.history = [];
            saveAndSync(); 
            alert("Sistema Ativado!");
            renderInterface();
        };
        reader.readAsText(file);
    }

    function saveAndSync() { 
        localStorage.setItem('futbet_master', JSON.stringify(masterData)); 
    }

    function login() {
        const u = document.getElementById('user-login').value.trim();
        const p = document.getElementById('pass-login').value.trim();
        if(u === "admin" && p === "admin1") {
            currentUser = "admin";
            document.getElementById('nav-bar').innerHTML = '<button onclick="showTab(\'ranking\')" class="active">Ranking</button><button onclick="showTab(\'admin\')">⚙️ Admin</button><button onclick="logout()" style="background:#511">Sair</button>';
            showTab('ranking');
        } else {
            const found = masterData.users.find(x => x.u === u && x.p === p);
            if(!found) return alert("Erro de Login!");
            currentUser = u;
            document.getElementById('nav-bar').innerHTML = '<button onclick="showTab(\'palpites\')" class="active">Palpites</button><button onclick="showTab(\'ranking\')">Ranking</button><button onclick="logout()" style="background:#511">Sair</button>';
            showTab('palpites');
        }
        document.getElementById('view-login').classList.add('hidden');
        document.getElementById('view-main').classList.remove('hidden');
        renderInterface();
    }

    // --- FUNÇÃO CORRIGIDA ---
    function updateMatchLocal() {
        const teamA = document.getElementById('adm-a').value;
        const teamB = document.getElementById('adm-b').value;
        const matchDate = document.getElementById('adm-date').value;

        if(!teamA || !teamB || !matchDate) return alert("Preencha todos os campos do jogo!");

        const m = { a: teamA, b: teamB, date: matchDate };
        
        masterData.match = m;
        if(!masterData.history) masterData.history = [];
        masterData.history.push(m);
        
        saveAndSync(); 
        renderInterface(); 
        alert("Jogo Publicado com Sucesso!");
    }

    function renderInterface() {
        // Atualiza Palpites do Jogador
        if(masterData.match && masterData.match.a) {
            document.getElementById('m-title').innerText = `${masterData.match.a} x ${masterData.match.b}`;
            document.getElementById('m-time').innerText = new Date(masterData.match.date).toLocaleString();
        }

        // Atualiza Histórico Admin
        const hL = document.getElementById('history-list'); hL.innerHTML = "";
        if(masterData.history) {
            masterData.history.slice().reverse().forEach((m, i) => {
                hL.innerHTML += `<div class="history-item"><b>${m.a} x ${m.b}</b><br>${new Date(m.date).toLocaleString()}</div>`;
            });
        }

        // Atualiza Lista de Jogadores Admin
        const uList = document.getElementById('user-manage-list'); uList.innerHTML = "";
        masterData.users.forEach((u, i) => {
            uList.innerHTML += `<div class="user-item"><span><b>${u.u}</b></span><div class="u-btns"><button class="btn-mini" onclick="editPlayer(${i})">Editar</button><button class="btn-mini" onclick="deletePlayer(${i})" style="background:#511">Excluir</button></div></div>`;
        });
    }

    function savePlayer() {
        const u = document.getElementById('n-u').value;
        const p = document.getElementById('n-p').value;
        const i = document.getElementById('n-i').value;
        if(!u || !p) return alert("Preencha!");
        masterData.users.push({u, p, img: i});
        saveAndSync(); renderInterface(); alert("Salvo!");
    }

    function showTab(t) {
        document.querySelectorAll('[id^="tab-"]').forEach(e => e.classList.add('hidden'));
        document.getElementById('tab-'+t).classList.remove('hidden');
    }

    function exportMasterFile() {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([JSON.stringify(masterData)], {type:"application/json"}));
        a.download = "Data.json"; a.click();
    }

    function resetSystem() { if(confirm("Zerar Tudo?")) { localStorage.clear(); location.reload(); } }
    function logout() { location.reload(); }
</script>
</body>
</html>
